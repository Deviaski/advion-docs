<style>
  .lang-switcher {
    position: relative;
    display: inline-block;
    margin-left: 0.5rem;
  }

  .lang-switcher__button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    padding: 0;
    color: inherit;
    cursor: pointer;
    background: transparent;
    border: 0;
    border-radius: 9999px;
  }

  .lang-switcher__button:hover,
  .lang-switcher__button[aria-expanded="true"] {
    background: var(--base-item-bg-hover, rgba(127, 127, 127, 0.12));
  }

  .lang-switcher__button:focus-visible,
  .lang-switcher__item:focus-visible {
    outline: 2px solid var(--base-link, #60a5fa);
    outline-offset: 2px;
  }

  .lang-switcher__icon {
    width: 1.25rem;
    height: 1.25rem;
    fill: currentColor;
  }

  .lang-switcher__menu {
    position: absolute;
    z-index: 60;
    top: calc(100% + 0.5rem);
    right: 0;
    min-width: 10rem;
    padding: 0.375rem;
    background: #1f2937;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 0.5rem;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.26);
  }

  .lang-switcher__item {
    display: block;
    width: 100%;
    padding: 0.5rem 0.75rem;
    color: #f9fafb;
    font: inherit;
    font-size: 0.875rem;
    line-height: 1.25rem;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    background: transparent;
    border: 0;
    border-radius: 0.375rem;
  }

  .lang-switcher__item:hover,
  .lang-switcher__item:focus-visible {
    background: rgba(255, 255, 255, 0.12);
  }

  .lang-switcher__item--active {
    font-weight: 600;
    color: #ffffff;
    background: rgba(255, 255, 255, 0.18);
  }

  .lang-switcher__item:disabled {
    cursor: wait;
    opacity: 0.65;
  }

  .lang-switcher__item[aria-disabled="true"] {
    cursor: wait;
    pointer-events: none;
    opacity: 0.65;
  }

  .lang-switcher__nav-active {
    color: var(--nav-item-text-active, inherit);
    font-weight: var(--nav-item-text-active-weight, 600);
    background: var(--nav-item-bg-active, rgba(127, 127, 127, 0.14));
    box-shadow: inset -1px 0 var(--nav-item-border-active, currentColor);
  }
</style>

<script>
(() => {
  const STORAGE_KEY = 'advion-preferred-locale';
  const SWITCHER_SELECTOR = '.lang-switcher';
  const THEME_SWITCHER_SELECTOR = '#retype-scheme-button';

  let locales = [];
  let defaultLocale;
  let basePath = '/';
  let localesPromise;
  let pageLoadInProgress = false;
  let activeMenuEvents;
  let sidebarObserver;

  const normalizePath = (path) => {
    const normalized = `/${path || ''}`.replace(/\/{2,}/g, '/');
    return normalized.endsWith('/') ? normalized : `${normalized}/`;
  };

  const getBasePath = () => {
    const turboRoot = document
      .querySelector('meta[name="turbo-root"]')
      ?.getAttribute('content');

    return normalizePath(turboRoot || '/');
  };

  const getRelativeSegments = () => {
    const pathname = decodeURIComponent(location.pathname);
    const relativePath = pathname.startsWith(basePath)
      ? pathname.slice(basePath.length)
      : pathname.replace(/^\/+/, '');

    return relativePath.split('/').filter(Boolean);
  };

  const getCurrentLocale = () => {
    const firstSegment = getRelativeSegments()[0];

    return locales.some((locale) => locale.code === firstSegment)
      ? firstSegment
      : defaultLocale.code;
  };

  const getPageSegments = () => {
    const segments = getRelativeSegments();

    if (locales.some((locale) => locale.code === segments[0])) {
      segments.shift();
    }

    return segments;
  };

  const getLocaleFromPathname = (pathname) => {
    const decodedPathname = decodeURIComponent(pathname);
    const relativePath = decodedPathname.startsWith(basePath)
      ? decodedPathname.slice(basePath.length)
      : decodedPathname.replace(/^\/+/, '');
    const firstSegment = relativePath.split('/').filter(Boolean)[0];

    return locales.some((locale) => locale.code === firstSegment)
      ? firstSegment
      : defaultLocale.code;
  };

  const buildUrl = (localeCode, pageSegments = [], preserveLocationState = true) => {
    const prefix = localeCode === defaultLocale.code ? [] : [localeCode];
    const pathname = normalizePath([
      basePath.replace(/^\/|\/$/g, ''),
      ...prefix,
      ...pageSegments
    ].filter(Boolean).join('/'));
    const target = new URL(pathname, location.origin);

    if (preserveLocationState) {
      target.search = location.search;
      target.hash = location.hash;
    }

    return target;
  };

  const pageExists = async (url) => {
    try {
      const response = await fetch(url, {
        method: 'HEAD',
        cache: 'no-cache',
        redirect: 'follow',
        signal: AbortSignal.timeout(5000)
      });

      return response.ok;
    } catch {
      return false;
    }
  };

  const getPreferredLocale = () => {
    const localeCode = localStorage.getItem(STORAGE_KEY);

    return locales.some((locale) => locale.code === localeCode)
      ? localeCode
      : null;
  };

  const closeMenu = (switcher) => {
    const button = switcher.querySelector('.lang-switcher__button');
    const menu = switcher.querySelector('.lang-switcher__menu');

    menu.hidden = true;
    button.setAttribute('aria-expanded', 'false');
  };

  const createSwitcher = () => {
    const currentLocale = getCurrentLocale();
    const switcher = document.createElement('div');
    switcher.className = 'lang-switcher';

    switcher.innerHTML = `
      <button class="lang-switcher__button" type="button" aria-label="Change language" aria-expanded="false" aria-haspopup="menu">
        <svg class="lang-switcher__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3h9v2h-3.1a15.4 15.4 0 0 1-2.9 6.4A15.7 15.7 0 0 0 19.2 14l-1.3 1.5a17.8 17.8 0 0 1-4.2-2.9A16.4 16.4 0 0 1 8 16.3l-1-1.7a14.4 14.4 0 0 0 5.2-3.3A13.2 13.2 0 0 1 9.7 5H6V3h6Zm-.3 2a11.4 11.4 0 0 0 2 4.9A12.7 12.7 0 0 0 15.8 5ZM5 13h2l4 8H8.8l-.9-2H4.1l-.9 2H1Zm.1 4h2l-1-2.3Z"></path>
        </svg>
      </button>
      <div class="lang-switcher__menu" role="menu" hidden></div>
    `;

    const button = switcher.querySelector('.lang-switcher__button');
    const menu = switcher.querySelector('.lang-switcher__menu');

    locales.forEach((locale) => {
      const item = document.createElement('a');
      item.className = 'lang-switcher__item';
      item.role = 'menuitem';
      item.textContent = locale.label;
      const samePage = buildUrl(locale.code, getPageSegments(), false);
      const languageHome = buildUrl(locale.code, [], false);
      item.href = samePage.href;
      item.dataset.langSwitcherSamePage = samePage.href;
      item.dataset.langSwitcherHome = languageHome.href;
      item.setAttribute('aria-disabled', 'true');

      if (locale.code === currentLocale) {
        item.classList.add('lang-switcher__item--active');
        item.setAttribute('aria-current', 'true');
      }

      item.addEventListener('click', (event) => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey ||
            event.shiftKey || event.altKey) return;

        if (item.getAttribute('aria-disabled') === 'true') {
          event.preventDefault();
          return;
        }

        localStorage.setItem(STORAGE_KEY, locale.code);

        if (locale.code === currentLocale) {
          event.preventDefault();
          closeMenu(switcher);
        }
      });

      menu.append(item);
    });

    button.addEventListener('click', async () => {
      const willOpen = menu.hidden;
      menu.hidden = !willOpen;
      button.setAttribute('aria-expanded', String(willOpen));

      if (!willOpen) return;

      const languageItems = Array.from(menu.querySelectorAll('.lang-switcher__item'));
      await Promise.all(languageItems.map(async (item) => {
        const samePage = new URL(item.dataset.langSwitcherSamePage);
        const languageHome = new URL(item.dataset.langSwitcherHome);
        item.href = (await pageExists(samePage))
          ? samePage.href
          : languageHome.href;
        item.removeAttribute('aria-disabled');
      }));
    });

    activeMenuEvents = new AbortController();

    document.addEventListener('click', (event) => {
      if (!switcher.contains(event.target)) closeMenu(switcher);
    }, { signal: activeMenuEvents.signal });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeMenu(switcher);
        button.focus();
      }
    }, { signal: activeMenuEvents.signal });

    return switcher;
  };

  const mountSwitcher = () => {
    activeMenuEvents?.abort();
    document.querySelector(SWITCHER_SELECTOR)?.remove();

    const themeSwitcher = document.querySelector(THEME_SWITCHER_SELECTOR);
    if (!themeSwitcher) return false;

    themeSwitcher.before(createSwitcher());
    return true;
  };

  const getSidebarList = () => {
    const sidebarLists = document.querySelectorAll('#retype-sidebar-left ul');
    return Array.from(sidebarLists).find((list) =>
      Array.from(list.children).some((child) =>
        child.tagName === 'LI' && child.querySelector('a[href]')
      )
    );
  };

  const getSegmentsFromUrl = (url) => {
    const relativePath = url.pathname.startsWith(basePath)
      ? url.pathname.slice(basePath.length)
      : url.pathname.replace(/^\/+/, '');
    const segments = relativePath.split('/').filter(Boolean);

    if (locales.some((locale) => locale.code === segments[0])) {
      segments.shift();
    }

    return segments;
  };

  const getLocalizedPageTitle = async (url) => {
    const response = await fetch(url, { cache: 'no-cache' });
    if (!response.ok) return null;

    const page = await response.text();
    const titleMatch = page.match(/window\.__DOCS__\s*=\s*\{\s*"title":\s*"([^"]+)"/);

    return titleMatch ? titleMatch[1] : null;
  };

  const localizeSidebar = async () => {
    const sidebarList = getSidebarList();

    if (!sidebarList) return false;

    const currentLocale = getCurrentLocale();
    if (currentLocale === defaultLocale.code ||
        sidebarList.dataset.langSwitcherLocale === currentLocale) {
      return true;
    }

    sidebarList.dataset.langSwitcherLocale = currentLocale;
    sidebarList.querySelectorAll('.lang-switcher__nav-active').forEach((row) => {
      row.classList.remove('lang-switcher__nav-active');
    });

    const links = Array.from(sidebarList.querySelectorAll('a[href]'));
    await Promise.all(links.map(async (link) => {
      const sourceUrl = new URL(link.href, location.origin);
      if (sourceUrl.origin !== location.origin) return;

      const localizedUrl = buildUrl(
        currentLocale,
        getSegmentsFromUrl(sourceUrl),
        false
      );
      const title = await getLocalizedPageTitle(localizedUrl);

      if (!title) return;

      link.href = localizedUrl.href;
      link.dataset.langSwitcherUrl = localizedUrl.href;

      const label = link.querySelector('span[class~="py-1.5"]');
      if (label) label.textContent = title;

      const isCurrentPage = normalizePath(localizedUrl.pathname) ===
        normalizePath(location.pathname);
      const row = link.closest('li')?.firstElementChild;

      if (isCurrentPage) {
        link.setAttribute('aria-current', 'page');
        row?.classList.add('lang-switcher__nav-active');
      } else {
        link.removeAttribute('aria-current');
      }

      link.addEventListener('click', (event) => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey ||
            event.shiftKey || event.altKey) return;

        event.preventDefault();
        event.stopImmediatePropagation();
        location.assign(localizedUrl);
      }, { capture: true });
    }));

    return true;
  };

  const watchSidebarLocale = () => {
    sidebarObserver?.disconnect();
    localizeSidebar();

    sidebarObserver = new MutationObserver(() => {
      localizeSidebar();
    });

    sidebarObserver.observe(document.body, {
      childList: true,
      subtree: true
    });
  };

  const redirectToPreferredLocale = async () => {
    const isDefaultHome =
      getCurrentLocale() === defaultLocale.code &&
      getPageSegments().length === 0;
    const preferredLocale = getPreferredLocale();

    if (!isDefaultHome || !preferredLocale ||
        preferredLocale === defaultLocale.code) {
      return false;
    }

    const preferredHome = buildUrl(preferredLocale);

    if (await pageExists(preferredHome)) {
      location.replace(preferredHome);
      return true;
    }

    return false;
  };

  const loadLocales = () => {
    if (!localesPromise) {
      basePath = getBasePath();
      const localesUrl = new URL(`${basePath}static/locales.json`, location.origin);

      localesPromise = fetch(localesUrl, { cache: 'no-cache' })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((loadedLocales) => {
          if (!Array.isArray(loadedLocales) || loadedLocales.length === 0) {
            throw new Error('The locale list is empty.');
          }

          locales = loadedLocales;
          defaultLocale = locales[0];
        });
    }

    return localesPromise;
  };

  const onPageLoad = async () => {
    if (pageLoadInProgress) return;
    pageLoadInProgress = true;

    try {
      await loadLocales();
      if (await redirectToPreferredLocale()) return;

      if (mountSwitcher()) {
        requestAnimationFrame(watchSidebarLocale);
        return;
      }

      const observer = new MutationObserver(() => {
        if (mountSwitcher()) {
          requestAnimationFrame(watchSidebarLocale);
          observer.disconnect();
        }
      });

      observer.observe(document.body, { childList: true, subtree: true });
    } catch (error) {
      console.warn('Language switcher could not be initialized.', error);
    } finally {
      pageLoadInProgress = false;
    }
  };

  document.addEventListener('DOMContentLoaded', onPageLoad, { once: true });
  document.addEventListener('turbo:load', onPageLoad);
})();
</script>
